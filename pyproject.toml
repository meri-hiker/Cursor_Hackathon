[project]
name = "same-person"
dynamic = ["version"]
description = "Resolve name-screening hits against customer records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
    "ruff>=0.8",
]
notebook = [
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.scripts]
same-person = "same_person.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "same_person.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
same_person = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
markers = ["slow: loads the full development set"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["same_person"]

[tool.ruff.lint.per-file-ignores]
# The dashboard is one HTML/JS template string.
"src/same_person/screener/dashboard.py" = ["E501"]
